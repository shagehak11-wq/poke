<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="チャンプ構築診断">
<meta name="theme-color" content="#0d111a">
<title>Pokémon Champions シングル構築診断（スマホ快適版）</title>
<style>
  :root {
    --bg:#0d111a;--panel:#151c2c;--panel-2:#1d273d;--border:#2a3754;
    --text:#eef3ff;--muted:#93a4c8;--accent:#38bdf8;
    --good:#22c55e;--warn:#f59e0b;--danger:#ef4444;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.48;overflow-x:hidden;}
  .top-sticky{position:sticky;top:0;z-index:50;background:rgba(13,17,26,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .top-bar{max-width:1180px;margin:0 auto;padding:10px 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .app-title{font-size:0.96rem;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .reg-pill{font-size:0.68rem;padding:2px 7px;border-radius:999px;background:rgba(56,189,248,0.16);color:var(--accent);border:1px solid rgba(56,189,248,0.45);}
  .mini-score{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:0.8rem;font-weight:700;cursor:pointer;flex-shrink:0;}
  .mini-grade{font-size:1rem;font-weight:900;}
  .tabs-wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:0 8px 6px;gap:6px;}
  .tab-btn{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:8px;padding:7px 4px;font-size:0.78rem;font-weight:700;cursor:pointer;text-align:center;}
  .tab-btn.active{background:var(--panel-2);color:#fff;border-color:var(--accent);}
  .tab-dot{display:inline-block;background:var(--danger);color:#fff;font-size:0.65rem;padding:0 5px;border-radius:999px;margin-left:3px;vertical-align:top;}
  .container{max-width:1180px;margin:0 auto;padding:12px 12px calc(32px + var(--safe-bottom));}
  .tab-panel{display:none;}.tab-panel.active{display:block;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
  .card-title{margin:0 0 10px;font-size:0.98rem;font-weight:800;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  .btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:0.8rem;font-weight:700;cursor:pointer;touch-action:manipulation;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:linear-gradient(135deg,#2563eb,#0284c7);border-color:#38bdf8;color:#fff;}
  .btn-danger{border-color:rgba(239,68,68,0.55);color:#fca5a5;}
  .btn-sm{padding:5px 9px;font-size:0.74rem;}.btn-block{width:100%;padding:12px;font-size:0.92rem;}
  .save-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .slot-tabs{display:flex;gap:6px;}
  .save-pill{padding:6px 12px;border-radius:999px;font-size:0.78rem;font-weight:700;background:var(--panel-2);color:var(--muted);border:1px solid var(--border);cursor:pointer;}
  .save-pill.active{background:rgba(56,189,248,0.18);color:#fff;border-color:var(--accent);}
  .presets-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .presets-scroll .btn{white-space:nowrap;flex-shrink:0;}
  .party-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:10px;}
  .slot{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px;}
  .slot.mega-active{border-color:#c084fc;box-shadow:0 0 0 1px rgba(192,132,252,0.35);}
  .slot-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:0.8rem;color:var(--muted);}
  .slot-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
  select{width:100%;max-width:100%;background:#0f1625;color:var(--text);border:1px solid #354569;border-radius:8px;padding:8px;font-size:16px;}
  @media(min-width:768px){select{font-size:0.86rem;padding:7px 8px;}}
  select:focus{outline:none;border-color:var(--accent);}
  .slot-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:0.74rem;color:var(--muted);margin-top:4px;}
  .type-badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:0.7rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.45);}
  .mega-tag{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;padding:1px 6px;border-radius:4px;font-size:0.68rem;font-weight:700;}
  .rank-tag{background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;color:#cbd5e1;}
  .dash-grid{display:grid;grid-template-columns:200px 1fr;gap:12px;}
  @media(max-width:720px){.dash-grid{grid-template-columns:1fr;}}
  .score-box{background:linear-gradient(160deg,#17233d,#101727);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
  .grade-circle{font-size:3rem;font-weight:900;line-height:1.05;margin:2px 0;}
  .score-num{font-size:1.15rem;font-weight:800;color:var(--accent);}
  .bars-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:9px;}
  .metric{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:10px;}
  .metric-head{display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;margin-bottom:5px;}
  .bar-bg{height:7px;background:#0b101c;border-radius:999px;overflow:hidden;margin-bottom:5px;}
  .bar-fill{height:100%;border-radius:999px;transition:width 0.3s ease;}
  .metric-desc{font-size:0.74rem;color:var(--muted);}
  .item-list{display:flex;flex-direction:column;gap:9px;}
  .alert-item{background:var(--panel-2);border-left:4px solid var(--accent);border-radius:8px;padding:10px 11px;font-size:0.82rem;}
  .alert-item.high{border-left-color:var(--danger);}.alert-item.mid{border-left-color:var(--warn);}.alert-item.good{border-left-color:var(--good);}
  .alert-title{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .alert-body{color:#cbd5e1;font-size:0.78rem;}
  .pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:0.69rem;font-weight:700;white-space:nowrap;}
  .pill-danger{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.5);}
  .pill-warn{background:rgba(245,158,11,0.2);color:#fcd34d;border:1px solid rgba(245,158,11,0.5);}
  .pill-good{background:rgba(34,197,94,0.2);color:#86efac;border:1px solid rgba(34,197,94,0.5);}
  .pill-info{background:rgba(56,189,248,0.18);color:#7dd3fc;border:1px solid rgba(56,189,248,0.45);}
  .rec-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:6px;}
  .rec-actions{display:flex;gap:6px;align-items:center;margin-top:2px;}
  .rec-actions select{width:auto;min-width:96px;padding:5px 7px;font-size:14px;}
  .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .threat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:9px;}
  .threat-card{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:10px;}
  .threat-card.severe{border-color:rgba(239,68,68,0.75);background:rgba(239,68,68,0.09);}
  .threat-card.caution{border-color:rgba(245,158,11,0.6);background:rgba(245,158,11,0.06);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:0.76rem;min-width:480px;}
  th,td{border:1px solid var(--border);padding:5px 4px;text-align:center;}
  th{background:#101727;color:var(--muted);font-weight:700;}
  .eff-4{background:rgba(239,68,68,0.42);color:#fecaca;font-weight:800;}
  .eff-2{background:rgba(239,68,68,0.22);color:#fca5a5;font-weight:700;}
  .eff-05{background:rgba(34,197,94,0.2);color:#86efac;}
  .eff-025{background:rgba(34,197,94,0.38);color:#bbf7d0;font-weight:700;}
  .eff-0{background:rgba(56,189,248,0.26);color:#bae6fd;font-weight:700;}
  .row-danger{background:rgba(239,68,68,0.09);}
  .notice-box{background:rgba(56,189,248,0.08);border:1px dashed rgba(56,189,248,0.4);border-radius:8px;padding:9px 11px;font-size:0.74rem;color:var(--muted);margin-top:10px;}
  .toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-bottom));transform:translateX(-50%) translateY(90px);background:#1e293b;color:#fff;border:1px solid var(--accent);padding:10px 16px;border-radius:999px;font-size:0.82rem;font-weight:700;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.45);transition:transform 0.25s ease;pointer-events:none;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="top-sticky">
  <div class="top-bar">
    <div class="app-title">⚔️ チャンプ構築診断 <span class="reg-pill">M-C内定のみ</span></div>
    <div class="mini-score" onclick="switchTab('diag')">
      <span>評価</span>
      <span id="miniGrade" class="mini-grade">-</span>
      <span id="miniScore" style="color:var(--accent);">0点</span>
    </div>
  </div>
  <div class="tabs-wrap">
    <button class="tab-btn active" id="tabBtn-edit" onclick="switchTab('edit')">📝 編成</button>
    <button class="tab-btn" id="tabBtn-diag" onclick="switchTab('diag')">📊 診断・改善</button>
    <button class="tab-btn" id="tabBtn-threat" onclick="switchTab('threat')">⚠️ 脅威<span id="threatBadge" class="tab-dot" style="display:none;">0</span></button>
    <button class="tab-btn" id="tabBtn-matrix" onclick="switchTab('matrix')">🛡️ 相性・上位</button>
  </div>
</div>

<div class="container">
  <div id="tab-edit" class="tab-panel active">
    <div class="card">
      <div class="save-bar">
        <div class="slot-tabs">
          <button class="save-pill active" id="saveBtn-0" onclick="selectSaveSlot(0)">構築A</button>
          <button class="save-pill" id="saveBtn-1" onclick="selectSaveSlot(1)">構築B</button>
          <button class="save-pill" id="saveBtn-2" onclick="selectSaveSlot(2)">構築C</button>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm" onclick="copyPartyText()">📋 コピー</button>
          <button class="btn btn-sm btn-danger" onclick="clearParty()">🗑 空にする</button>
        </div>
      </div>
      <div style="font-size:0.74rem;color:var(--muted);margin-bottom:6px;font-weight:700;">上位構築サンプル（横スクロール可）：</div>
      <div class="presets-scroll">
        <button class="btn btn-sm" onclick="loadPreset('lucarioZ')">Tier1: メガルカリオZ対面</button>
        <button class="btn btn-sm" onclick="loadPreset('kabamanda')">Tier1: カバマンダ＋サフゴ</button>
        <button class="btn btn-sm" onclick="loadPreset('sunnyGuso')">M-7上位: 晴れムシキング</button>
        <button class="btn btn-sm" onclick="loadPreset('floetteGab')">上位: フラエッテ＋ガブZ</button>
        <button class="btn btn-sm" onclick="loadPreset('psychicBlastoise')">流行: イエッサン＋カメックス</button>
        <button class="btn btn-sm" onclick="loadPreset('draft')">課題あり試作サンプル</button>
      </div>
      <div id="partyGrid" class="party-grid"></div>
      <div style="margin-top:12px;">
        <button class="btn btn-primary btn-block" onclick="switchTab('diag')">📊 このパーティの診断結果・改善点を見る →</button>
      </div>
      <div class="notice-box">※ 構築は自動保存されます。メガストーン所持でメガ後のタイプ・特性・Sで評価。未実装道具（ハチマキ・メガネ・チョッキ・ブーツ・ダイス等）除外済み。</div>
    </div>
  </div>

  <div id="tab-diag" class="tab-panel">
    <div class="card">
      <div class="card-title"><span>総合評価スコア</span><span id="summaryBadges" style="display:flex;gap:5px;flex-wrap:wrap;"></span></div>
      <div class="dash-grid">
        <div class="score-box">
          <div style="font-size:0.78rem;color:var(--muted);">総合ランク</div>
          <div id="gradeText" class="grade-circle">-</div>
          <div id="scoreText" class="score-num">0 / 100点</div>
          <div id="gradeComment" style="font-size:0.76rem;color:var(--muted);margin-top:4px;"></div>
        </div>
        <div id="metricsBox" class="bars-box"></div>
      </div>
    </div>
    <div class="card"><div class="card-title"><span>優先改善ポイント</span></div><div id="issuesList" class="item-list"></div></div>
    <div class="card"><div class="card-title"><span>おすすめ補完ポケモン＆内定道具 TOP5</span></div><div id="recList" class="item-list"></div></div>
  </div>

  <div id="tab-threat" class="tab-panel">
    <div class="card">
      <div class="card-title"><span>相手に来たらきついポケモン（24体）</span><span id="threatSummary" style="font-size:0.76rem;color:var(--muted);"></span></div>
      <div class="filter-bar">
        <button class="save-pill active" id="thFilt-all" onclick="setThreatFilter('all')">すべて (24)</button>
        <button class="save-pill" id="thFilt-severe" onclick="setThreatFilter('severe')">🚨 きついのみ</button>
        <button class="save-pill" id="thFilt-warn" onclick="setThreatFilter('warn')">⚠️ 要注意以上</button>
      </div>
      <div id="threatGrid" class="threat-grid"></div>
    </div>
  </div>

  <div id="tab-matrix" class="tab-panel">
    <div class="card"><div class="card-title"><span>防御タイプ相性表（特性・風船・半減実込み）</span></div><div class="table-wrap" id="typeTableWrap"></div></div>
    <div class="card"><div class="card-title"><span>上位構築アーキタイプとの照合・相性</span></div><div id="archetypeList" class="item-list"></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const TYPES=['ノーマル','ほのお','みず','でんき','くさ','こおり','かくとう','どく','じめん','ひこう','エスパー','むし','いわ','ゴースト','ドラゴン','あく','はがね','フェアリー'];
const TYPE_COLOR={'ノーマル':'#9ca3af','ほのお':'#ea580c','みず':'#2563eb','でんき':'#ca8a04','くさ':'#16a34a','こおり':'#0891b2','かくとう':'#b91c1c','どく':'#9333ea','じめん':'#b45309','ひこう':'#6366f1','エスパー':'#db2777','むし':'#65a30d','いわ':'#78716c','ゴースト':'#5b21b6','ドラゴン':'#4f46e5','あく':'#374151','はがね':'#475569','フェアリー':'#ec4899'};
const CHART={'ノーマル':{'いわ':0.5,'ゴースト':0,'はがね':0.5},'ほのお':{'ほのお':0.5,'みず':0.5,'くさ':2,'こおり':2,'むし':2,'いわ':0.5,'ドラゴン':0.5,'はがね':2},'みず':{'ほのお':2,'みず':0.5,'くさ':0.5,'じめん':2,'いわ':2,'ドラゴン':0.5},'でんき':{'みず':2,'でんき':0.5,'くさ':0.5,'じめん':0,'ひこう':2,'ドラゴン':0.5},'くさ':{'ほのお':0.5,'みず':2,'くさ':0.5,'どく':0.5,'じめん':2,'ひこう':0.5,'むし':0.5,'いわ':2,'ドラゴン':0.5,'はがね':0.5},'こおり':{'ほのお':0.5,'みず':0.5,'くさ':2,'こおり':0.5,'じめん':2,'ひこう':2,'ドラゴン':2,'はがね':0.5},'かくとう':{'ノーマル':2,'こおり':2,'どく':0.5,'ひこう':0.5,'エスパー':0.5,'むし':0.5,'いわ':2,'ゴースト':0,'あく':2,'はがね':2,'フェアリー':0.5},'どく':{'くさ':2,'どく':0.5,'じめん':0.5,'いわ':0.5,'ゴースト':0.5,'はがね':0,'フェアリー':2},'じめん':{'ほのお':2,'でんき':2,'くさ':0.5,'どく':2,'ひこう':0,'むし':0.5,'いわ':2,'はがね':2},'ひこう':{'でんき':0.5,'くさ':2,'かくとう':2,'むし':2,'いわ':0.5,'はがね':0.5},'エスパー':{'かくとう':2,'どく':2,'エスパー':0.5,'あく':0,'はがね':0.5},'むし':{'ほのお':0.5,'くさ':2,'かくとう':0.5,'どく':0.5,'ひこう':0.5,'エスパー':2,'ゴースト':0.5,'あく':2,'はがね':0.5,'フェアリー':0.5},'いわ':{'ほのお':2,'こおり':2,'かくとう':0.5,'じめん':0.5,'ひこう':2,'むし':2,'はがね':0.5},'ゴースト':{'ノーマル':0,'エスパー':2,'ゴースト':2,'あく':0.5},'ドラゴン':{'ドラゴン':2,'はがね':0.5,'フェアリー':0},'あく':{'かくとう':0.5,'エスパー':2,'ゴースト':2,'あく':0.5,'フェアリー':0.5},'はがね':{'ほのお':0.5,'みず':0.5,'でんき':0.5,'こおり':2,'いわ':2,'はがね':0.5,'フェアリー':2},'フェアリー':{'ほのお':0.5,'かくとう':2,'どく':0.5,'ドラゴン':2,'あく':2,'はがね':0.5}};

const STORAGE_KEY='pokechamp_mc_mobile_v1';
let savedSlots=[JSON.parse(JSON.stringify(PRESETS.kabamanda)),JSON.parse(JSON.stringify(PRESETS.lucarioZ)),Array.from({length:6},()=>({name:'',item:'',role:'物理アタッカー'}))];
let currentSlotIdx=0,threatFilter='all',toastTimer=null;

function loadStorage(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const o=JSON.parse(raw);if(Array.isArray(o.slots)&&o.slots.length===3)savedSlots=o.slots;if(typeof o.current==='number'&&o.current>=0&&o.current<3)currentSlotIdx=o.current;}catch(e){}}
function saveStorage(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({slots:savedSlots,current:currentSlotIdx}));}catch(e){}}
function getParty(){return savedSlots[currentSlotIdx];}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2000);}
function switchTab(id){['edit','diag','threat','matrix'].forEach(t=>{document.getElementById('tab-'+t).classList.toggle('active',t===id);document.getElementById('tabBtn-'+t).classList.toggle('active',t===id);});window.scrollTo({top:0,behavior:'smooth'});}
function selectSaveSlot(idx){currentSlotIdx=idx;[0,1,2].forEach(i=>document.getElementById('saveBtn-'+i).classList.toggle('active',i===idx));saveStorage();renderAll();showToast('構築'+['A','B','C'][idx]+'に切り替えました');}
function setThreatFilter(f){threatFilter=f;['all','severe','warn'].forEach(k=>document.getElementById('thFilt-'+k).classList.toggle('active',k===f));renderResults();}

function resolveMember(slot){
  if(!slot||!slot.name||!POKEMON_DB[slot.name])return null;

function effectiveDefMult(m,at){
  let v=typeEff(at,m.types);
  if(at==='じめん'&&(m.ability==='ふゆう'||m.item==='ふうせん'))return 0;
  if(at==='ほのお'&&m.ability==='もらいび')return 0;
  if(at==='ほのお'&&m.ability==='ねつこうかん')return 0.25;
  if((at==='ほのお'||at==='こおり')&&m.ability==='あついしぼう')v*=0.5;
  if(at==='くさ'&&m.ability==='そうしょく')return 0;
  if(at==='でんき'&&m.ability==='ひらいしん')return 0;
  if(BERRY_RESIST[m.item]===at&&v>=2)v*=0.5;

}

function evaluateThreat(members,th){
  let best=-10,sec=-10,counters=[];
  for(const m of members){
    let sc=0,wd=0;
    for(const at of th.atkTypes){const e=effectiveDefMult(m,at);if(e>wd)wd=e;}
    sc+=wd<=0.5?4:wd===1?1.5:wd===2?-2:-4;
    if(th.cat==='phys'&&(m.tags.includes('physBulk')||m.role==='物理受け'))sc+=2.2;
    if(th.cat==='spec'&&(m.tags.includes('spBulk')||m.role==='特殊受け'))sc+=2.2;
    if(m.ability==='ばけのかわ'||m.ability==='マルチスケイル'||m.item==='きあいのタスキ')sc+=1.6;
    if(m.ability==='てんねん'&&(th.id.includes('カイリュー')||th.id.includes('ギャラドス')||th.id.includes('カメックス')||th.id.includes('ミミッキュ')))sc+=3;
    let bo=0;
    for(const ot of m.off){let e=typeEff(ot,th.types);if(ot==='じめん'&&th.ability==='ふゆう')e=0;if(ot==='ほのお'&&th.ability==='ねつこうかん')e=0.25;if(e>bo)bo=e;}
    sc+=bo>=4?3.5:bo>=2?2.2:bo>=1?0.5:-2;
    const isSp=(m.role==='特殊アタッカー'||m.role==='両刀アタッカー'||m.stats[3]>=120);
    const isPh=(m.role==='物理アタッカー'||m.role==='積みエース'||m.stats[1]>=120);
    if(th.bulk==='physHigh'&&isSp)sc+=1.8;
    if(th.bulk==='physHigh'&&!isSp&&bo<2)sc-=1.8;
    if(th.bulk==='spHigh'&&isPh)sc+=1.5;
    if(th.bulk==='bothHigh'&&m.tags.includes('wallbreak'))sc+=1.8;
    if(th.bulk==='contact'&&isPh&&!m.off.includes('じめん'))sc-=1.5;
    if(getEffectiveSpeed(m)>th.spd)sc+=1.8;
    else if(m.tags.includes('priority')&&!th.id.includes('イエッサン'))sc+=1.2;
    if(th.id==='サーフゴー'&&(m.role==='起点作成・サポート'||m.role==='物理受け')&&!m.off.includes('ほのお')&&!m.off.includes('じめん')&&!m.off.includes('ゴースト')&&!m.off.includes('あく'))sc-=2.5;
    if(th.id==='イエッサン♂＋メガカメックス'&&(m.tags.includes('terrain')||m.ability==='かわりもの'||m.ability==='てんねん'))sc+=2.5;
    if(th.id==='カバルドン'&&(m.tags.includes('antiStatus')||m.item==='ラムのみ'))sc+=2.2;
    if(sc>=4.2)counters.push(m.displayName);
    if(sc>best){sec=best;best=sc;}else if(sc>sec)sec=sc;
  }
  const comb=best*0.65+sec*0.35;
  const level=(best<3.6||comb<2.4)?'severe':(best<5.2||comb<4.0)?'caution':'ok';
  return {threat:th,level,bestScore:best,combined:comb,counters};
}
